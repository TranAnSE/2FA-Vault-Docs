name: ci

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ci.yml
      - docs/**
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - docs/**

permissions:
  contents: write # required by retypeapp/action-github-pages to push the built site

jobs:
  retype-build:
    name: Retype build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps and validate docs
        # Runs markdownlint + the Retype build (validate:docs), so a markdown
        # hygiene regression or a parse error fails the build before publish.
        run: |
          npm ci --no-audit
          npm run validate:docs

      - uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 7.0.x

      - uses: retypeapp/action-build@latest

      - uses: retypeapp/action-github-pages@latest
        with:
          branch: main
          directory: public
          update-branch: true
